name: Build CX4 PIO STATUS42 FINAL V9.1 FIFO ARM

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
      - name: Checkout Pico SDK 2.2.0
        uses: actions/checkout@v4
        with:
          repository: raspberrypi/pico-sdk
          ref: 2.2.0
          path: pico-sdk
          submodules: recursive
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build gcc-arm-none-eabi libnewlib-arm-none-eabi curl
      - name: Fetch pinned instruction-level CX4 core
        run: |
          mkdir -p third_party
          curl -fsSL https://raw.githubusercontent.com/RetroPortingToolKit/snesrecomp/bb37c87/runner/src/snes/cx4.c -o third_party/cx4.c
          curl -fsSL https://raw.githubusercontent.com/RetroPortingToolKit/snesrecomp/bb37c87/runner/src/snes/cx4.h -o third_party/cx4.h
          python3 tools/patch_upstream_cx4.py third_party/cx4.c
          grep -q "uint8_t cx4_read" third_party/cx4.c
          grep -q "void cx4_sync" third_party/cx4.c
      - name: Static final-diagnostic checks
        run: |
          grep -q "PIO_STATUS42_FINAL_V9.1_FIFO_ARM" cx4_active_bus.c
          grep -q "status42_drive_program" cx4_active_bus.c
          grep -q "STAT42_VALUE 0x42" cx4_active_bus.c
          grep -q "pio_sm_put" cx4_active_bus.c
          ! grep -q "pio_interrupt_set" cx4_active_bus.c
          grep -q "pull block" status42_drive.pio
          grep -q "wait 1 gpio 0" status42_drive.pio
          grep -q "out pindirs, 9" status42_drive.pio
          grep -q "STATTEST" main.c
          grep -q "hardware_pio" CMakeLists.txt
          ! grep -R "GP41\|GP42" -n status42_drive.pio cx4_active_bus.c | grep -v "No external\|unused" || true
      - name: Configure
        env:
          PICO_SDK_PATH: ${{ github.workspace }}/pico-sdk
        run: cmake -S . -B build -G Ninja
      - name: Build
        run: cmake --build build
      - name: Rename UF2
        run: cp build/cx4_pio_status42_final_v9_1.uf2 build/CX4_PIO_STATUS42_FINAL_V9.1_FIFO_ARM_GENERIC_SEM_ROM.uf2
      - name: Upload UF2
        uses: actions/upload-artifact@v4
        with:
          name: CX4-PIO-STATUS42-FINAL-V9-1-FIFO
          path: build/CX4_PIO_STATUS42_FINAL_V9.1_FIFO_ARM_GENERIC_SEM_ROM.uf2
