name: Build CX4 BOOTBACK HLE BUSY SYNC V4

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
      - name: Checkout Pico SDK 2.2.0
        uses: actions/checkout@v4
        with:
          repository: raspberrypi/pico-sdk
          ref: 2.2.0
          path: pico-sdk
          submodules: recursive
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build gcc-arm-none-eabi libnewlib-arm-none-eabi curl
      - name: Fetch pinned CX4 core for selfcheck only
        run: |
          mkdir -p third_party
          curl -fsSL https://raw.githubusercontent.com/RetroPortingToolKit/snesrecomp/bb37c87/runner/src/snes/cx4.c -o third_party/cx4.c
          curl -fsSL https://raw.githubusercontent.com/RetroPortingToolKit/snesrecomp/bb37c87/runner/src/snes/cx4.h -o third_party/cx4.h
          python3 tools/patch_upstream_cx4.py third_party/cx4.c
          grep -q "int cx4_load_firmware" third_party/cx4.c
      - name: Configure
        env:
          PICO_SDK_PATH: ${{ github.workspace }}/pico-sdk
        run: cmake -S . -B build -G Ninja
      - name: Build
        run: cmake --build build
      - name: Rename UF2
        run: cp build/cx4_bootback_busy_sync_v4.uf2 build/CX4_BOOTBACK_HLE_BUSY_SYNC_V4_GENERIC_SEM_ROM.uf2
      - name: Upload UF2
        uses: actions/upload-artifact@v4
        with:
          name: CX4-BOOTBACK-HLE-BUSY-SYNC-V4
          path: build/CX4_BOOTBACK_HLE_BUSY_SYNC_V4_GENERIC_SEM_ROM.uf2
