name: Build CX4 v0.4.3 no-speculative state write-forward generic UF2

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Checkout Pico SDK 2.2.0
        uses: actions/checkout@v4
        with:
          repository: raspberrypi/pico-sdk
          ref: 2.2.0
          path: pico-sdk
          submodules: recursive

      - name: Install ARM toolchain and build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build gcc-arm-none-eabi libnewlib-arm-none-eabi curl

      - name: Fetch and adapt CX4 LLE core
        run: |
          mkdir -p third_party
          curl -fsSL https://raw.githubusercontent.com/RetroPortingToolKit/snesrecomp/main/runner/src/snes/cx4.c -o third_party/cx4.c
          curl -fsSL https://raw.githubusercontent.com/RetroPortingToolKit/snesrecomp/main/runner/src/snes/cx4.h -o third_party/cx4.h
          python3 tools/patch_upstream_cx4.py third_party/cx4.c
          grep -q "int cx4_load_firmware" third_party/cx4.c
          grep -q "cx4_synthesize_data_rom(c);" third_party/cx4.c
          echo "CX4 upstream patch OK"

      - name: Configure
        env:
          PICO_SDK_PATH: ${{ github.workspace }}/pico-sdk
        run: cmake -S . -B build -G Ninja

      - name: Build generic UF2
        run: cmake --build build

      - name: Rename generic UF2
        run: cp build/snes_rp2350b_capture.uf2 build/CX4_v0.4.3_GENERIC_SEM_ROM.uf2

      - name: Upload generic UF2
        uses: actions/upload-artifact@v4
        with:
          name: cx4-v0.4.3-generic-uf2
          path: build/CX4_v0.4.3_GENERIC_SEM_ROM.uf2
