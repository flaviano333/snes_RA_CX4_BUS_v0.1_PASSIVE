name: Build CX4 SINGLE SNAPSHOT LLE V8.2 LIVE INTERLEAVE

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
      - name: Checkout Pico SDK 2.2.0
        uses: actions/checkout@v4
        with:
          repository: raspberrypi/pico-sdk
          ref: 2.2.0
          path: pico-sdk
          submodules: recursive
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build gcc-arm-none-eabi libnewlib-arm-none-eabi curl
      - name: Fetch pinned instruction-level CX4 core
        run: |
          mkdir -p third_party
          curl -fsSL https://raw.githubusercontent.com/RetroPortingToolKit/snesrecomp/bb37c87/runner/src/snes/cx4.c -o third_party/cx4.c
          curl -fsSL https://raw.githubusercontent.com/RetroPortingToolKit/snesrecomp/bb37c87/runner/src/snes/cx4.h -o third_party/cx4.h
          python3 tools/patch_upstream_cx4.py third_party/cx4.c
          grep -q "uint8_t cx4_read" third_party/cx4.c
          grep -q "void cx4_sync" third_party/cx4.c
          grep -q "uint64_t cx4_instructions_executed" third_party/cx4.c
      - name: Static architecture checks
        run: |
          ! grep -R "hle_conv_oam\|hle_math_command\|hle_on_command" -n cx4_active_bus.c
          grep -q "SINGLE_SNAPSHOT_LLE_V8_2_LIVE" cx4_active_bus.c
          grep -q "write_q_push" cx4_active_bus.c
          grep -q "SIO_SINGLE_SNAPSHOT" main.c
          ! grep -R "pico_generate_pio_header\|hardware_pio\|hardware_dma" -n CMakeLists.txt main.c
          grep -q "TX_MASTER_CHUNK" cx4_active_bus.c
          grep -q "SERVICE_WRITE_BUDGET" cx4_active_bus.c
          grep -q "transaction_step_budget" cx4_active_bus.c
          grep -q "cx4_write(s_cx4" cx4_active_bus.c
          grep -q "cx4_sync(s_cx4" cx4_active_bus.c
      - name: Configure
        env:
          PICO_SDK_PATH: ${{ github.workspace }}/pico-sdk
        run: cmake -S . -B build -G Ninja
      - name: Build
        run: cmake --build build
      - name: Rename UF2
        run: cp build/cx4_single_snapshot_lle_v8_2.uf2 build/CX4_SINGLE_SNAPSHOT_LLE_V8_2_LIVE_GENERIC_SEM_ROM.uf2
      - name: Upload UF2
        uses: actions/upload-artifact@v4
        with:
          name: CX4-SINGLE-SNAPSHOT-LLE-V8-2-LIVE
          path: build/CX4_SINGLE_SNAPSHOT_LLE_V8_2_LIVE_GENERIC_SEM_ROM.uf2
