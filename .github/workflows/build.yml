name: Build BUS VALIDATOR v1.0.8 READ ONLY SETTLED
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: raspberrypi/pico-sdk
          ref: 2.2.0
          path: pico-sdk
          submodules: recursive
      - run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build gcc-arm-none-eabi libnewlib-arm-none-eabi
      - name: Configure
        env:
          PICO_SDK_PATH: ${{ github.workspace }}/pico-sdk
        run: cmake -S . -B build -G Ninja
      - name: Build
        run: cmake --build build
      - run: cp build/snes_rp2350b_bus_validator.uf2 build/BUS_VALIDATOR_v1.0.8_READ_ONLY_SETTLED.uf2
      - uses: actions/upload-artifact@v4
        with:
          name: bus-validator-v1.0.8-read-only-settled
          path: build/BUS_VALIDATOR_v1.0.8_READ_ONLY_SETTLED.uf2
